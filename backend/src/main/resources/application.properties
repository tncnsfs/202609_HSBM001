spring.application.name=backend
# dockers/.env 파일을 설정값으로 읽어 옴 → 비밀번호를 여기 또 적지 않아도 됨
# optional: = 파일이 없어도 에러 없이 넘어감 / [.properties] = "이름=값" 형식으로 읽으라는 뜻
# ../ = 백엔드 실행 위치(backend 폴더)에서 한 칸 위 = 프로젝트 폴더
spring.config.import=optional:file:../dockers/.env[.properties]

# 어느 DB에 붙을지: jdbc:postgresql://주소:포트/DB이름
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
# 접속 아이디, 비밀번호 (.env 값을 그대로 씀)
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}